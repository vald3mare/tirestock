# ВРЕМЕННЫЙ обход для машин, где firewall блокирует межконтейнерный трафик
# (FORWARD droppped): сервисы ходят друг к другу через published-порты хоста.
# Использование:
#   docker compose -f docker-compose.yml -f docker-compose.hostnet-workaround.yml up
# Правильное решение — починить firewall (см. README), этот файл тогда не нужен.
services:
  api:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tirestock}:${POSTGRES_PASSWORD:-tirestock}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-tirestock}?sslmode=disable
  web:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_URL: http://host.docker.internal:${API_PORT:-8080}
