# Локальная разработка и тестовый домен — один и тот же compose с разными env.
# Запуск: docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tirestock}
      POSTGRES_USER: ${POSTGRES_USER:-tirestock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tirestock}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tirestock} -d ${POSTGRES_DB:-tirestock}"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build: ../api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tirestock}:${POSTGRES_PASSWORD:-tirestock}@postgres:5432/${POSTGRES_DB:-tirestock}?sslmode=disable
      API_ADDR: ":8080"
      # Доставка заявок и заказов. Приоритет: прямой tradesk → мост Битрикса → мок.
      # TRADESK_BASE_URL — основной путь (http://tradesk.ru). ⚠️ БОЕВАЯ учётка.
      # OLDSITE_BASE_URL — аварийный мост через /ajax Битрикса, задавать только
      # если прямой контур недоступен (см. docs/OLDSITE_AJAX.md).
      OLDSITE_BASE_URL: ${OLDSITE_BASE_URL:-}
      TRADESK_BASE_URL: ${TRADESK_BASE_URL:-}
      TRADESK_USERNAME: ${TRADESK_USERNAME:-}
      TRADESK_PASSWORD: ${TRADESK_PASSWORD:-}
      # Пометка тестового стенда в комментарии заявок (на проде — пусто).
      DELIVERY_TEST_MARK: ${DELIVERY_TEST_MARK:-}
      # Сид первого пользователя админки (создаётся, только если таблица пуста).
      ADMIN_BOOTSTRAP_USER: ${ADMIN_BOOTSTRAP_USER:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_NAME: ${ADMIN_BOOTSTRAP_NAME:-}
      # Синк каталога из SelectTyres (пусто → мок).
      SELECTYRES_FEED_URL: ${SELECTYRES_FEED_URL:-}
      SELECTYRES_SYNC_INTERVAL: ${SELECTYRES_SYNC_INTERVAL:-1h}
      SELECTYRES_WHEELS_FEED_URL: ${SELECTYRES_WHEELS_FEED_URL:-}
      SELECTYRES_PHOTO_FEED_URL: ${SELECTYRES_PHOTO_FEED_URL:-}
      SELECTYRES_STOCK_SPB: ${SELECTYRES_STOCK_SPB:-}
      SELECTYRES_MIN_HEALTHY_RATIO: ${SELECTYRES_MIN_HEALTHY_RATIO:-}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ../web
    environment:
      API_URL: http://api:8080
      # Индексация. По умолчанию сайт ЗАКРЫТ от поисковиков (robots Disallow +
      # X-Robots-Tag noindex) — тестовый домен не должен попасть в индекс рядом
      # со старым tirestock.ru. На боевом домене выставить SITE_INDEXABLE=true.
      SITE_INDEXABLE: "${SITE_INDEXABLE:-false}"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      # Кэш оптимизированных фото — вне контейнера, переживает пересборку образа.
      - web-image-cache:/app/.next/cache/images
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  # Кэш пережатых фото товаров. Отдельный том, а не слой контейнера: переживает
  # пересборку образа (после деплоя фото не оптимизируются заново) и не раздувает
  # сам контейнер. Размер ограничен images.maximumDiskCacheSize в next.config.ts.
  web-image-cache:
