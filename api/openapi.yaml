openapi: 3.0.3
info:
  title: TireStock API
  description: >
    Контракт витрины TireStock. Источник истины: любое изменение API начинается
    с правки этого файла, из него генерируются TS-типы в web/lib/api/.
  version: 0.1.0

servers:
  - url: /api/v1

paths:
  /health:
    get:
      operationId: getHealth
      summary: Проверка живости сервиса и БД
      responses:
        "200":
          description: Сервис и БД в порядке
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        "503":
          $ref: "#/components/responses/Error"

  /products:
    get:
      operationId: listProducts
      summary: Каталог шин с фильтрами и пагинацией
      description: >
        Имена фильтров совпадают с query-параметрами URL витрины.
      parameters:
        - { name: q,         in: query, schema: { type: string }, description: "Текстовый поиск по названию/бренду/модели" }
        - { name: width,     in: query, schema: { type: integer }, description: "Ширина, мм (205)" }
        - { name: profile,   in: query, schema: { type: integer }, description: "Профиль, % (55)" }
        - { name: diameter,  in: query, schema: { type: integer }, description: "Диаметр, дюймы (16)" }
        - { name: season,    in: query, schema: { $ref: "#/components/schemas/Season" } }
        - { name: brand,     in: query, schema: { type: string }, description: "Бренд (Nokian)" }
        - { name: price_min, in: query, schema: { type: integer, minimum: 0 }, description: "Цена от, ₽" }
        - { name: price_max, in: query, schema: { type: integer, minimum: 0 }, description: "Цена до, ₽" }
        - { name: spikes,    in: query, schema: { type: boolean }, description: "Шипы" }
        - { name: runflat,   in: query, schema: { type: boolean }, description: "RunFlat" }
        - { name: sort,      in: query, schema: { type: string, enum: [price_asc, price_desc, name] }, description: "Сортировка (по умолчанию — наличие + релевантность)" }
        - { name: city,      in: query, schema: { type: string, enum: [spb, msk], default: spb }, description: "Город (мультигород): цена/остаток и ассортимент по городу" }
        - { name: page,      in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page,  in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
      responses:
        "200":
          description: Страница каталога
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "400":
          $ref: "#/components/responses/Error"

  /catalog/facets:
    get:
      operationId: getCatalogFacets
      summary: Реальные значения фильтров, присутствующие в каталоге
      description: >
        Бренды и типоразмеры, фактически имеющиеся в ассортименте города.
        Витрина строит из них опции сайдбара вместо статики.
      parameters:
        - { name: city, in: query, schema: { type: string, enum: [spb, msk], default: spb }, description: "Город" }
      responses:
        "200":
          description: Фасеты каталога
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogFacets"

  /order-status:
    get:
      operationId: getOrderStatus
      summary: Статус заказа по номеру (обратная интеграция tradesk)
      description: >
        Читает статус заказа ИЗ tradesk (GET /data/status?order_code=). Страница
        /status/ витрины. found=false — заказ не найден или tradesk-приём выключен.
      parameters:
        - { name: code, in: query, required: true, schema: { type: string }, description: "Номер заказа" }
      responses:
        "200":
          description: Статус заказа (или found=false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatus"

  /pickup-points:
    get:
      operationId: listPickupPoints
      summary: Опубликованные пункты выдачи (страница /points)
      description: >
        Пункты выдачи заказов витрины города (city, по умолчанию spb). Контент
        редактируется в админке: адрес, метро, часы, бейдж-акция у каждого — свои.
        is_main — «основной адрес» (крупная карточка, первым).
      parameters:
        - { name: city, in: query, schema: { type: string, default: spb }, description: "Город пунктов (spb|msk)" }
      responses:
        "200":
          description: Пункты в порядке вывода (основные первыми)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PickupPoint"

  /pickup-points/{slug}:
    get:
      operationId: getPickupPoint
      summary: Пункт выдачи по slug (отдельная страница /points/<slug>)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Пункт выдачи
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupPoint"
        "404":
          $ref: "#/components/responses/Error"

  /benefits:
    get:
      operationId: listBenefits
      summary: Опубликованные офферы строки «Преимущества» (главная)
      description: >
        Строка офферов над каталогом (BenefitsBar). Контент редактируется в
        админке (раздел «Преимущества»), поэтому витрина берёт его по API.
      responses:
        "200":
          description: Офферы в порядке вывода
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Benefit"

  /seo:
    get:
      operationId: resolveSeo
      summary: Эффективная SEO-мета маршрута витрины
      description: >
        title/description для generateMetadata статических страниц. Значения
        маршрута с подстановкой дефолт-шаблона по пустым полям. Мета редактируется
        в админке (раздел «SEO-мета»). Контентные страницы несут мету сами.
      parameters:
        - { name: path, in: query, schema: { type: string }, description: "Маршрут, напр. /catalog (пусто → /)" }
      responses:
        "200":
          description: Эффективная мета
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeoResolved"

  /products/{slug}:
    get:
      operationId: getProductBySlug
      summary: Товар по slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - { name: city, in: query, schema: { type: string, enum: [spb, msk], default: spb }, description: "Город: цена/остаток по городу; нет оффера → 404" }
      responses:
        "200":
          description: Товар
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/Error"

  /orders:
    post:
      operationId: createOrder
      summary: Оформление заказа
      description: >
        Заказ пишется в БД транзакционно со строкой outbox; воркер доставляет
        его в tradesk с ретраями — заказ никогда не теряется. Idempotency-key
        (заголовок или поле тела) защищает от даблклика «Оформить заказ».
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "201":
          description: Заказ принят
          content:
            application/json:
              schema:
                type: object
                required: [order_id]
                properties:
                  order_id:
                    type: integer
                    format: int64
        "400":
          $ref: "#/components/responses/Error"

  /requests:
    post:
      operationId: createRequest
      summary: Заявка с формы услуги
      description: >
        Формы сервисных страниц (шиномонтаж, хранение, ремонт и покраска дисков).
        Уходит в tradesk `POST /api/request` через outbox — с типом услуги,
        в отличие от обратного звонка.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestInput"
      responses:
        "201":
          description: Заявка принята
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [accepted]
        "400":
          $ref: "#/components/responses/Error"

  /callbacks:
    post:
      operationId: createCallback
      summary: Заявка «обратный звонок»
      description: Попадает в tradesk (раздел «Обратный звонок») через outbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallbackInput"
      responses:
        "201":
          description: Заявка принята
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [accepted]
        "400":
          $ref: "#/components/responses/Error"

components:
  responses:
    Error:
      description: Ошибка в едином формате
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"

  schemas:
    Season:
      type: string
      enum: [summer, winter, allseason]

    Product:
      type: object
      required:
        [id, slug, brand, model, name, size_label, width, profile, diameter,
         season, spikes, runflat, price, stock, image_url, badge_hit]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string, example: nokian-hakkapeliitta-10p-205-55-r16 }
        code: { type: string, example: t668559, description: "Код товара в SelectTyres — уходит в заказ tradesk" }
        brand: { type: string, example: Nokian }
        model: { type: string, example: Hakkapeliitta 10p }
        name: { type: string, example: Nokian Hakkapeliitta 10p 205/55 R16 }
        size_label: { type: string, example: 205/55 R16 94T }
        width: { type: integer, example: 205 }
        profile: { type: integer, example: 55 }
        diameter: { type: integer, example: 16 }
        season: { $ref: "#/components/schemas/Season" }
        spikes: { type: boolean }
        runflat: { type: boolean }
        price: { type: integer, description: "Рубли за штуку", example: 12490 }
        stock: { type: integer, example: 16 }
        image_url: { type: string, description: "Фото из SelectTyres (пусто → плейсхолдер)" }
        badge_hit: { type: boolean, description: "Бейдж «Хит» (оверрайд админки)" }

    ProductList:
      type: object
      required: [items, total, page, per_page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total: { type: integer }
        page: { type: integer }
        per_page: { type: integer }

    OrderItem:
      type: object
      required: [slug, name, price, qty]
      properties:
        slug: { type: string }
        code: { type: string, example: t668559, description: "Код товара в SelectTyres — уходит в приёмник заказа tradesk" }
        name: { type: string }
        price: { type: integer, description: "Рубли за штуку" }
        qty: { type: integer, minimum: 1, default: 4, description: "Шины покупают комплектами — дефолт 4" }

    CreateOrderInput:
      type: object
      required: [customer_name, phone, items]
      properties:
        idempotency_key: { type: string }
        customer_name: { type: string, example: Иван Петров }
        phone: { type: string, example: "+7 (921) 123-45-67" }
        comment: { type: string }
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItem"

    CatalogFacets:
      type: object
      required: [brands, widths, profiles, diameters, popular_sizes]
      properties:
        brands: { type: array, items: { type: string } }
        widths: { type: array, items: { type: integer } }
        profiles: { type: array, items: { type: integer } }
        diameters: { type: array, items: { type: integer } }
        popular_sizes:
          type: array
          description: "Топ типоразмеров по числу товаров в наличии (чипы «Популярно» в hero)"
          items:
            type: object
            required: [width, profile, diameter, label]
            properties:
              width: { type: integer }
              profile: { type: integer }
              diameter: { type: integer }
              label: { type: string, example: "205/55 R16" }

    OrderStatus:
      type: object
      required: [found, code, status, status_text, step, date, point, products]
      properties:
        found: { type: boolean }
        code: { type: string, example: C288416 }
        status: { type: string, description: "Сырой код статуса tradesk", example: ready }
        status_text: { type: string, example: "Готов к выдаче" }
        step: { type: integer, description: "Этап прогресса 0..4 (0 — без полосы)" }
        date: { type: string, description: "Дата исполнения dd-mm-yyyy или пусто" }
        point: { type: string, description: "Пункт выдачи" }
        products:
          type: array
          items:
            type: object
            required: [name, qty, price, sum]
            properties:
              name: { type: string }
              qty: { type: integer }
              price: { type: integer }
              sum: { type: integer }

    PickupPoint:
      type: object
      required: [id, slug, address, metro, hours, badge, note, is_central, is_main, city, sort_order, published]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string, description: "URL-slug для страницы /points/<slug>", example: novoselov-49 }
        address: { type: string, example: "ул. Новосёлов, 49" }
        metro: { type: string, example: "м. Ломоносовская" }
        hours: { type: string, example: "09:00–21:00" }
        badge: { type: string, description: "Акция-бейдж", example: "−15% на шиномонтаж" }
        note: { type: string, description: "Доп. описание пункта" }
        is_central: { type: boolean, description: "Устаревший флаг центрального склада" }
        is_main: { type: boolean, description: "Основной адрес (крупная карточка, первым)" }
        city: { type: string, description: "Город пункта", example: spb }
        sort_order: { type: integer }
        published: { type: boolean }

    Benefit:
      type: object
      required: [id, icon, title, note, href, sort_order, published]
      properties:
        id: { type: integer, format: int64 }
        icon: { type: string, description: "Путь к svg-иконке", example: /icons/benefit-mount.svg }
        title: { type: string, example: "−15% на шиномонтаж" }
        note: { type: string, example: при покупке шин }
        href: { type: string, description: "Ссылка на страницу сервиса (пусто — не кликабелен)", example: /mounting/ }
        sort_order: { type: integer }
        published: { type: boolean }

    SeoResolved:
      type: object
      required: [title, description]
      properties:
        title: { type: string, example: "Шины — купить в Санкт-Петербурге | TireStock" }
        description: { type: string }

    RequestInput:
      type: object
      required: [phone, type]
      properties:
        name: { type: string, example: Иван }
        phone: { type: string, example: "+7 (921) 123-45-67" }
        type: { type: string, example: Шиномонтаж, description: "Тип заявки — уходит в tradesk отдельным полем" }
        comment: { type: string }

    CallbackInput:
      type: object
      required: [phone]
      properties:
        name: { type: string, example: Иван }
        phone: { type: string, example: "+7 (921) 123-45-67" }
        comment: { type: string }

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: "Стабильный строковый код: validation_failed, not_found, internal_error, db_unavailable"
            message: { type: string }
