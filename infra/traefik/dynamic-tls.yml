# Динамический конфиг Traefik для ПРОДА с доменом (HTTPS), файловый провайдер
# (docker-провайдер несовместим с Docker v29 → 404).
# ВАЖНО: домен указан КОНКРЕТНО в rule — иначе ACME не знает, для чего выпускать
# сертификат (HostRegexp без домена → Traefik отдаёт self-signed). certResolver на
# самом роутере обязателен, чтобы Let's Encrypt выпустил сертификат для этих хостов.
# Смена домена — поменять хосты ниже (одна строка) и пересоздать traefik.
http:
  routers:
    web:
      rule: "Host(`tirestock.website`) || Host(`www.tirestock.website`)"
      entryPoints:
        - websecure
      service: web
      tls:
        certResolver: le
  services:
    web:
      loadBalancer:
        servers:
          - url: "http://web:3000"
