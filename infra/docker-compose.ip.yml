# Прод-развёртывание TireStock БЕЗ домена — по публичному IP, HTTP (:80).
# Для старта, пока не куплен домен. TLS нет (Let's Encrypt требует домен).
# Reverse-proxy НЕ нужен: единственная задача — проброс :80 → web:3000, это делает
# нативный docker port-mapping. (Traefik остаётся в docker-compose.prod.yml для
# домена+HTTPS; на очень свежем Docker он не совместим с провайдером — решим при
# переезде на домен, напр. через Caddy/новый Traefik.)
# Индексация ВЫКЛЮЧЕНА (SITE_INDEXABLE=false): сырой IP не для поисковиков.
#
# Запуск: cd infra && docker compose -f docker-compose.ip.yml --env-file .env.prod up -d --build
services:
  api:
    build: ../api
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_ADDR: ":8080"
      TRADESK_BASE_URL: ${TRADESK_BASE_URL}
      TRADESK_USERNAME: ${TRADESK_USERNAME:-}
      TRADESK_PASSWORD: ${TRADESK_PASSWORD:-}
      SELECTYRES_FEED_URL: ${SELECTYRES_FEED_URL:-}
      SELECTYRES_PHOTO_FEED_URL: ${SELECTYRES_PHOTO_FEED_URL:-}
      SELECTYRES_SYNC_INTERVAL: ${SELECTYRES_SYNC_INTERVAL:-1h}
      SELECTYRES_MIN_HEALTHY_RATIO: ${SELECTYRES_MIN_HEALTHY_RATIO:-0.5}
      SELECTYRES_STOCK_SPB: ${SELECTYRES_STOCK_SPB:-spb,sankt-peterburg}
      SELECTYRES_STOCK_MSK: ${SELECTYRES_STOCK_MSK:-moskva,moscow,mosobl}
      ADMIN_BOOTSTRAP_USER: ${ADMIN_BOOTSTRAP_USER}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      ADMIN_BOOTSTRAP_NAME: ${ADMIN_BOOTSTRAP_NAME:-Администратор}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build: ../web
    restart: always
    environment:
      API_URL: http://api:8080
      HOSTNAME: "0.0.0.0"
      SITE_INDEXABLE: "false"
    # Витрина напрямую на 80-м порту хоста (без reverse-proxy).
    ports:
      - "80:3000"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - web-image-cache:/app/.next/cache/images

volumes:
  web-image-cache:
